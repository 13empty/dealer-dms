<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <title>Dealer DMS</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("dms.prefs") || "{}");
        var t = p.theme || "oro";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.density = p.density || "comodo";
        document.documentElement.dataset.type = p.typeSize || "md";
      } catch (e) {}
    </script>
  </head>
  <body class="bg-ink-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
